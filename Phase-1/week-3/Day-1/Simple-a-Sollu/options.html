<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple-ah Sollu — Settings</title>
  <style>
    :root {
      --mango: #ff8a00;
      --kumkum: #e4406f;
      --jasmine: #fff8ee;
      --ink: #2b2118;
      --muted: #7a6a5c;
      --line: #f1dfc8;
    }
    body {
      margin: 0;
      background: var(--jasmine);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    }
    header {
      background: linear-gradient(135deg, var(--mango), var(--kumkum));
      color: #fff;
      padding: 20px 24px;
    }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; opacity: 0.9; }
    main { max-width: 560px; margin: 24px auto; padding: 0 16px; }
    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
    }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: Consolas, monospace;
    }
    input:focus { outline: 2px solid var(--mango); border-color: transparent; }
    .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
    .show-key { font-weight: normal; display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; }
    .buttons { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: var(--mango); color: #fff; }
    .primary:hover { background: var(--kumkum); }
    .secondary { background: #f4ebe0; color: var(--ink); }
    .secondary:hover { background: #eadccb; }
    #status { margin-top: 14px; min-height: 20px; font-size: 14px; }
    #status.ok { color: #2e8b57; }
    #status.warn { color: #9a6a00; }
    #status.error { color: #c0392b; }
  </style>
</head>
<body>
  <header>
    <h1>Simple-ah Sollu 💬 Settings</h1>
    <p>Add your Groq details once and you're ready.</p>
  </header>

  <main>
    <div class="panel">
      <label for="apiKey">Groq API key</label>
      <input id="apiKey" type="password" placeholder="gsk_..." autocomplete="off" spellcheck="false" />
      <label class="show-key"><input id="showKey" type="checkbox" /> Show key</label>
      <div class="hint">Get one free at console.groq.com → API Keys. It's saved only in this browser.</div>

      <label for="model">Model name</label>
      <input id="model" type="text" placeholder="e.g. llama-3.3-70b-versatile" spellcheck="false" />
      <div class="hint">Copy the exact model ID from console.groq.com → Models.</div>

      <div class="buttons">
        <button id="save" class="primary" type="button">Save 💾</button>
        <button id="clearKey" class="secondary" type="button">Remove key</button>
      </div>
      <div id="status" role="status"></div>
    </div>
  </main>

  <!-- Extension pages can't run inline scripts, so the logic lives in options.js -->
  <script src="options.js"></script>
</body>
</html>
